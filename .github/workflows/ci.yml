name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOMAXPROCS: "2"
      GOGC: "20"
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: pricing, POSTGRES_PASSWORD: pricing_dev_only, POSTGRES_DB: pricing }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U pricing" --health-interval 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.27" }
      - run: gofmt -l ./cmd ./internal
      - run: go vet ./...
      - run: go test -p 1 ./...
      - run: go build -p 1 ./...
      # Migrations are integration-tested against the real Postgres service above.
      - name: apply migrations
        run: go run -p 1 ./cmd/api -migrate
        env:
          MIGRATION_DATABASE_URL: postgres://pricing:pricing_dev_only@localhost:5432/pricing?sslmode=disable
      - name: migrations are idempotent
        run: go run -p 1 ./cmd/api -migrate
        env:
          MIGRATION_DATABASE_URL: postgres://pricing:pricing_dev_only@localhost:5432/pricing?sslmode=disable
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: apps/*/package-lock.json }
      - run: npm ci
        working-directory: apps/web-app
      - run: npm run build
        working-directory: apps/web-app
      - run: npm ci
        working-directory: apps/web-public
      - run: npm run build
        working-directory: apps/web-public
      - run: npm ci
        working-directory: apps/admin-web
      - run: npm run build
        working-directory: apps/admin-web
